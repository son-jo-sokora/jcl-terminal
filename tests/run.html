<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCL エラーテスト</title>
<style>
:root{--bg:#f6f5f1;--ink:#1d1d1b;--soft:#6b6a64;--line:#dcdad2;--ok:#1f7a3a;--ng:#b42318;--na:#8a6d00;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#18191b;--ink:#e8e6df;--soft:#a3a197;--line:#34363a;--ok:#5cc47e;--ng:#ff8a7a;--na:#e0c060;--card:#222428}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sum{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 20px;font-size:15px}
.sum b{font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.ng{color:var(--ng)}.na{color:var(--na)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--soft);font-weight:600}
td.id{font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
details pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,Consolas,monospace;margin:6px 0;max-height:260px;overflow:auto}
.f{display:flex;gap:8px;margin:8px 0}
iframe{display:none}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<main>
<h1>JCL エラーテスト</h1>
<p>z/OS 3.2 のメッセージ集（IEFC・IEF・JES2）から、利用者の JCL で起きるエラーを1件ずつテストします。「確度:低」は、マニュアルから発生条件や文面を一つに決められなかったものです。</p>
<div class="sum" id="sum">実行中…</div>
<div class="f"><label><input type="checkbox" id="onlyng"> 失敗だけ表示</label></div>
<div class="wrap"><table><thead><tr><th>結果</th><th>メッセージ</th><th>内容</th><th>Max-RC</th><th>詳細</th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>テスト対象外</h2>
<div id="na"></div>
</main>
<iframe id="app" src="../index.html?test"></iframe>
<script src="cases.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('app').addEventListener('load',()=>{
  const T=document.getElementById('app').contentWindow.JCLTEST;
  const {CASES,NA}=window.JCL_TEST;
  const rows=[];let ok=0,ng=0;
  for(const c of CASES){
    T.reset();
    for(const lib in c.members||{})for(const m in c.members[lib])T.addMember(lib,m,c.members[lib][m]);
    let jobs=[],err=null;
    try{if(c.pre)T.run(c.pre);jobs=T.run(c.deck);}catch(e){err=e;}
    const j=jobs[jobs.length-1];
    const text=j?j.spool.map(s=>`--- ${s.dd}\n`+s.lines.join('\n')).join('\n'):'';
    const miss=(c.expect||[]).filter(r=>!r.test(text));
    const ccOk=!c.maxcc||(j&&c.maxcc.test(j.maxcc||''));
    const pass=!err&&j&&!miss.length&&ccOk;
    pass?ok++:ng++;
    rows.push({c,pass,j,text,miss,ccOk,err});
  }
  // exercises: every sample answer must pass and every starting member must fail
  for(const e of T.exercises()){
    const start=e.start||[`//${e.id.padEnd(8)} JOB (ACCT),'USER01',CLASS=A,MSGCLASS=X`,'//* EMPTY'];
    for(const[kind,lines,want]of[['解答例は合格する',e.answer,true],['書き始めの状態は不合格',start,false]]){
      const g=T.grade(e.id,lines),pass=g.pass===want;pass?ok++:ng++;
      rows.push({c:{id:e.id,t:`演習 ${e.id}: ${kind}`,deck:lines,maxcc:/./},pass,j:null,text:g.items.map(x=>(x.ok?'✓ ':'✗ ')+x.label).join('\n')+'\n'+g.notes.join('\n'),miss:[],ccOk:true,err:null});
    }
  }
  const naCount=Object.values(NA).reduce((a,v)=>a+v.length,0);
  document.getElementById('sum').innerHTML=`<span>テスト <b>${CASES.length}</b> 件</span><span class="ok">成功 <b>${ok}</b></span><span class="ng">失敗 <b>${ng}</b></span><span class="na">対象外 <b>${naCount}</b> 件</span>`;
  const draw=()=>{
    const only=document.getElementById('onlyng').checked;
    document.getElementById('rows').innerHTML=rows.filter(r=>!only||!r.pass).map(r=>`<tr>
      <td class="${r.pass?'ok':'ng'}">${r.pass?'成功':'失敗'}</td>
      <td class="id">${esc(r.c.id)}${r.c.low?'<br><span class="na">確度:低</span>':''}</td>
      <td>${esc(r.c.t)}${r.miss.length?`<br><span class="ng">出ていない: ${r.miss.map(m=>esc(m.source)).join(' / ')}</span>`:''}${r.ccOk?'':`<br><span class="ng">Max-RC が想定と違う（想定 ${esc(r.c.maxcc.source)}）</span>`}${r.err?`<br><span class="ng">${esc(r.err)}</span>`:''}</td>
      <td class="id">${esc(r.j?r.j.maxcc||r.j.status||'':'')}</td>
      <td><details><summary>JCL と出力</summary><pre>${esc(r.c.deck.join('\n'))}</pre><pre>${esc(r.text)}</pre></details></td></tr>`).join('');
  };
  document.getElementById('onlyng').onchange=draw;draw();
  document.getElementById('na').innerHTML=Object.entries(NA).map(([k,v])=>`<p><b>${esc(k)}</b>（${v.length}件）<br><span class="id">${v.map(esc).join(' ')}</span></p>`).join('');
  window.RESULT={ok,ng,rows:rows.map(r=>({id:r.c.id,t:r.c.t,pass:r.pass,maxcc:r.j&&r.j.maxcc,miss:r.miss.map(m=>m.source),err:r.err&&String(r.err)}))};
});
</script>
</body>
</html>
